name: Build APK Subalterno

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Permisos del wrapper
        run: chmod +x gradlew || true

      - name: Compilar APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Localizar APK
        run: |
          echo "APKs encontrados:"
          find . -name "*.apk" -type f

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: subalterno-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 90

      - name: Crear Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
